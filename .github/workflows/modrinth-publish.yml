name: Publish to Modrinth

on:
  workflow_run:
    workflows:
      - Build Release Artifacts
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Prepare Publish Matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Download jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hitboxplus-*-jars
          path: release-jars
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: hitboxplus-release-metadata
          path: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build publish matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          base_version = Path("release-metadata/version.txt").read_text().strip()
          game_versions = [
              line.strip()
              for line in Path("release-metadata/game_versions.txt").read_text().splitlines()
              if line.strip()
          ]

          entries = []
          for game_version in game_versions:
              expected = sorted(Path("release-jars").glob(f"*+{game_version}.jar"))
              expected = [path for path in expected if not path.name.endswith("-sources.jar")]
              if len(expected) != 1:
                  raise SystemExit(f"Expected one release jar for {game_version}, found {len(expected)}")

              version = f"{base_version}+{game_version}"
              entries.append({
                  "minecraft": game_version,
                  "file": expected[0].as_posix(),
                  "version": version,
                  "name": f"HitBox+ {version}",
              })

          print(f"matrix={json.dumps({'include': entries}, separators=(',', ':'))}")
          PY

  publish:
    name: Publish ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Download jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hitboxplus-*-jars
          path: release-jars
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify Modrinth file
        shell: bash
        run: test -f "${{ matrix.file }}"

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: 'hitboxplus'
          name: ${{ matrix.name }}
          version: ${{ matrix.version }}
          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
          files: ${{ matrix.file }}
          dependencies: |-
            [
              {
                "project_id": "1eAoo2KR",
                "dependency_type": "required"
              },
              {
                "project_id": "P7dR8mSH",
                "dependency_type": "required"
              },
              {
                "project_id": "mOgUt4GM",
                "dependency_type": "optional"
              }
            ]
