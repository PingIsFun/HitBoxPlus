name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          if [ -z "$version" ] || [ "$version" = "$ref" ]; then
            echo "Release tags must use v<version>, for example v0.2.0" >&2
            exit 1
          fi

          mapfile -t version_dirs < <(find versions -mindepth 2 -maxdepth 2 -name gradle.properties -printf '%h\n' | sort)
          if [ "${#version_dirs[@]}" -eq 0 ]; then
            echo "No Stonecutter version directories found under versions/*/gradle.properties" >&2
            exit 1
          fi

          tasks=()
          game_versions=()
          for dir in "${version_dirs[@]}"; do
            minecraft_version="$(basename "$dir")"
            tasks+=(":${minecraft_version}:buildAndCollect")
            game_versions+=("$minecraft_version")
          done

          mkdir -p build/release-metadata
          printf '%s\n' "$version" > build/release-metadata/version.txt
          printf '%s\n' "${game_versions[@]}" > build/release-metadata/game_versions.txt

          {
            echo "version=$version"
            echo "tasks=${tasks[*]}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release jars
        run: ./gradlew ${{ steps.metadata.outputs.tasks }} -Pmod.version=${{ steps.metadata.outputs.version }}

      - name: Locate release jars
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          jar_dir="build/libs/${{ steps.metadata.outputs.version }}"
          mapfile -t all_jars < <(find "$jar_dir" -maxdepth 1 -type f -name '*.jar' | sort)
          if [ "${#all_jars[@]}" -eq 0 ]; then
            echo "No jars found in build/libs/${{ steps.metadata.outputs.version }}" >&2
            exit 1
          fi

          {
            echo "all_files<<EOF"
            printf '%s\n' "${all_jars[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hitboxplus-${{ steps.metadata.outputs.version }}-jars
          path: ${{ steps.artifacts.outputs.all_files }}
          if-no-files-found: error

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: hitboxplus-release-metadata
          path: build/release-metadata/*
          if-no-files-found: error

      - name: Attach jars to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.artifacts.outputs.all_files }}
